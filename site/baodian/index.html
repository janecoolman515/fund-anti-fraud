<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>国央企求职宝典</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #E8E3D8;
    color: #33322E;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部固定条 */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(44, 74, 62, .96);
    backdrop-filter: blur(8px);
    color: #F5F2EA;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .16);
  }
  header a.back {
    color: #F5F2EA;
    text-decoration: none;
    font-size: 13px;
    border: 1px solid rgba(255, 255, 255, .24);
    background: rgba(255, 255, 255, .12);
    border-radius: 6px;
    padding: 7px 12px;
    white-space: nowrap;
    transition: .15s;
  }
  header a.back:hover { background: rgba(255, 255, 255, .22); }
  header .title {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  header .spacer { flex: 1; }
  header .pager {
    font-size: 12.5px;
    color: #D9E2DC;
    font-family: Consolas, monospace;
    white-space: nowrap;
  }
  header .pager b { color: #fff; font-size: 14px; }

  /* 顶部进度条 */
  #bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0;
    background: #8FBF9F;
    z-index: 101;
    transition: width .1s linear;
  }

  /* 文档区：一整页竖排 */
  #doc {
    max-width: 900px;
    margin: 0 auto;
    padding: 22px 14px 60px;
  }

  .page {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    box-shadow: 0 2px 14px rgba(44, 74, 62, .13);
    border-radius: 3px;
    margin-bottom: 10px;
  }

  .pno {
    text-align: center;
    font-size: 11px;
    color: #A8A294;
    font-family: Consolas, monospace;
    margin: 0 0 20px;
    letter-spacing: 1px;
  }

  /* 回到顶部 */
  #top {
    position: fixed;
    right: 18px;
    bottom: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(44, 74, 62, .9);
    color: #F5F2EA;
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .22);
    z-index: 99;
  }
  #top.on { display: flex; }

  footer {
    text-align: center;
    font-size: 12px;
    color: #8A8578;
    padding: 8px 16px 40px;
    line-height: 1.9;
  }
  footer b { color: #2C4A3E; font-weight: 500; }
  footer .wx { color: #3D6B52; font-family: Consolas, monospace; font-size: 13px; }

  @media (max-width: 520px) {
    header { padding: 9px 10px; gap: 8px; }
    header .title { display: none; }
    #doc { padding: 12px 8px 40px; }
    .page { margin-bottom: 8px; }
    .pno { margin-bottom: 14px; }
  }
</style>
</head>
<body>

<div id="bar"></div>

<header>
  <a href="../index.html" class="back">← 返回查询</a>
  <span class="title">国央企求职宝典</span>
  <span class="spacer"></span>
  <span class="pager">第 <b id="cur">1</b> / 36 页</span>
</header>

<main id="doc"></main>

<button id="top" aria-label="回到顶部">↑</button>

<footer>
  国央企职业规划师 · <b>沈老师</b> &nbsp;|&nbsp; 微信：<span class="wx">cnwy1543</span>
</footer>

<script>
const TOTAL = 36;
const doc = document.getElementById('doc');
const curEl = document.getElementById('cur');
const bar = document.getElementById('bar');
const topBtn = document.getElementById('top');

/* 生成 36 张图，前两张立即加载，其余懒加载 */
const frag = document.createDocumentFragment();
for (let i = 1; i <= TOTAL; i++) {
  const img = document.createElement('img');
  img.className = 'page';
  img.loading = i <= 2 ? 'eager' : 'lazy';
  img.src = 'v2/p' + String(i).padStart(2, '0') + '.jpg';
  img.alt = '第 ' + i + ' 页';
  frag.appendChild(img);

  const no = document.createElement('div');
  no.className = 'pno';
  no.textContent = '— ' + i + ' —';
  frag.appendChild(no);
}
doc.appendChild(frag);

const imgs = Array.from(doc.querySelectorAll('.page'));
let ticking = false;

function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function () {
    const scrollTop = window.scrollY;
    const docH = document.documentElement.scrollHeight - window.innerHeight;

    bar.style.width = (docH > 0 ? (scrollTop / docH * 100) : 0) + '%';

    /* 当前页：视口上方 1/3 处落在哪张图上 */
    const probe = scrollTop + window.innerHeight / 3;
    let current = 1;
    for (let i = 0; i < imgs.length; i++) {
      if (imgs[i].offsetTop <= probe) current = i + 1;
      else break;
    }
    curEl.textContent = current;

    topBtn.classList.toggle('on', scrollTop > 800);

    ticking = false;
  });
}

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
window.addEventListener('load', onScroll);
onScroll();

topBtn.addEventListener('click', function () {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>

</body>
</html>
